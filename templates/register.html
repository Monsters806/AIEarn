<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - AI Earn</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:#1e293b;
    width:340px;
    padding:25px;
    border-radius:15px;
}
h2{
    color:white;
    text-align:center;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:16px;
    cursor:pointer;
}
a{
    color:#38bdf8;
    text-decoration:none;
}
p{
    color:white;
    text-align:center;
    margin-top:15px;
}
</style>
</head>
<body>

<div class="card">
<h2>Create Account</h2>

<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>

<button type="submit">Create Account</button>
</form>

<p>Already have an account?
<a href="/login">Login</a>
</p>

</div>

</body>
</html>
